<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile - Rentex</title>

  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

  <div id="header-placeholder"></div>

  <div class="profile-container">
    <h1>My Profile</h1>
    <div id="profile-info">Loading profile…</div>

    <h2>Owned Cars</h2>
    <div id="owned-cars" class="cars-grid">
      <p>Loading owned cars…</p>
    </div>

    <h2>Rented Cars</h2>
    <div id="rented-cars" class="cars-grid">
      <p>Loading rented cars…</p>
    </div>
    <h2>Liked Cars</h2>
    <div id="liked-cars" class="cars-grid">
      <p>Loading liked cars…</p>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

  <script src="JavaScript/common.js"></script>
  <script src="JavaScript/loadHeaderFooter.js"></script>
  <script src="JavaScript/profile.js"></script>
</body>
</html>
